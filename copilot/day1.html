<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Login Form</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --primary-hover: #45a049;
            --border-color: #ccc;
            --error-color: red;
            --text-dark: #333;
            --bg-light: #f4f4f4;
            --padding-small: 5px;
            --padding-base: 10px;
            --padding-container: 20px;
            --border-radius: 4px;
            --shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: var(--padding-container);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            margin-bottom: var(--padding-small);
            display: block;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: var(--padding-base);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: var(--padding-base);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            padding: 0;
            font-size: 14px;
        }

        .toggle-password:hover {
            background-color: transparent;
        }

        .error {
            color: var(--error-color);
            font-size: 14px;
            margin-top: var(--padding-small);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
                <div class="error" id="usernameError"></div>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password">
                    <button type="button" class="toggle-password" id="togglePassword">Show</button>
                </div>
                <div class="error" id="passwordError"></div>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        const formElements = {
            form: document.getElementById('loginForm'),
            username: document.getElementById('username'),
            password: document.getElementById('password'),
            toggleBtn: document.getElementById('togglePassword'),
            usernameError: document.getElementById('usernameError'),
            passwordError: document.getElementById('passwordError')
        };

        const errors = {
            usernameRequired: 'Username is required.',
            passwordRequired: 'Password is required.',
            passwordLength: 'Password must be at least 6 characters long.'
        };

        function setError(field, message) {
            field.textContent = message;
        }

        function clearErrors() {
            setError(formElements.usernameError, '');
            setError(formElements.passwordError, '');
        }

        function validateForm() {
            clearErrors();
            let isValid = true;

            const username = formElements.username.value.trim();
            if (username === '') {
                setError(formElements.usernameError, errors.usernameRequired);
                isValid = false;
            }

            const password = formElements.password.value;
            if (password === '') {
                setError(formElements.passwordError, errors.passwordRequired);
                isValid = false;
            } else if (password.length < 6) {
                setError(formElements.passwordError, errors.passwordLength);
                isValid = false;
            }

            return isValid;
        }

        function togglePasswordVisibility() {
            const isHidden = formElements.password.type === 'password';
            formElements.password.type = isHidden ? 'text' : 'password';
            formElements.toggleBtn.textContent = isHidden ? 'Hide' : 'Show';
        }

        // Event listeners
        formElements.form.addEventListener('submit', function(event) {
            event.preventDefault();
            if (validateForm()) {
                alert('Login successful!');
                // TODO: Add form submission or redirect logic here
            }
        });

        formElements.toggleBtn.addEventListener('click', togglePasswordVisibility);
    </script>
</body>
</html>
