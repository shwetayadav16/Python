<!DOCTYPE html> <!-- HTML5 document type declaration -->
<html lang="en"> <!-- Root element with language set to English -->
<head> <!-- Head section containing metadata -->
    <meta charset="UTF-8"> <!-- Character encoding set to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive design for mobile devices -->
    <title>Responsive Login Form</title> <!-- Page title in browser tab -->
    <style> 
    /* Internal CSS styles */
        /* Body styles: sets font, light grey background, centers content */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Login container: white card with padding, rounded corners, shadow */
        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        /* Login form: flex column layout */
        .login-form {
            display: flex;
            flex-direction: column;
        }
        /* Form group: spacing between fields */
        .form-group {
            margin-bottom: 15px;
        }
        /* Label styles: block display with margin */
        label {
            margin-bottom: 5px;
            display: block;
        }
        /* Input styles for text and password: full width, padding, border */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        /* Button styles: green background, white text, padding, no border */
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        /* Button hover: darker green */
        button:hover {
            background-color: #45a049;
        }
        /* Error message styles: red text, small font, top margin */
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
        /* Media query for small screens: reduce padding */
        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body> <!-- Main body of the document -->
    <!-- contribution test -->

    <div class="login-container"> <!-- Main container for the login form -->
        <h2>Login</h2> <!-- Form title -->
        <form class="login-form" id="loginForm"> <!-- Login form with class and id for styling and JavaScript -->
            <div class="form-group"> <!-- Form group for username -->

                <label for="username">Username:</label> <!-- Label for username input -->

                <input type="text" id="username" name="username"> <!-- Text input for username -->

                <div class="error" id="usernameError"></div> <!-- Placeholder for username error messages -->

            </div>
            <div class="form-group"> <!-- Form group for password -->
                <label for="password">Password:</label> <!-- Label for password input -->
                <div style="position: relative;"> <!-- Relative positioned container for toggle button -->
                    <input type="password" id="password" name="password" style="padding-right: 70px;"> <!-- Password input with extra padding for button -->
                    <button type="button" id="togglePassword" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #333; cursor: pointer; padding: 0; font-size: 14px;">Show</button> <!-- Button to toggle password visibility -->
                </div>
                <div class="error" id="passwordError"></div> <!-- Placeholder for password error messages -->
            </div>
            <button type="submit">Login</button> <!-- Submit button for the form -->
        </form>
    </div>

    <script> <!-- JavaScript for form validation and password toggle -->
        // Add event listener for form submission
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission
            let isValid = true; // Flag to track if form is valid

            // Clear previous errors
            document.getElementById('usernameError').textContent = '';
            document.getElementById('passwordError').textContent = '';

            // Validate username
            const username = document.getElementById('username').value.trim();
            if (username === '') {
                document.getElementById('usernameError').textContent = 'Username is required.';
                isValid = false;
            }

            // Validate password
            const password = document.getElementById('password').value;
            if (password === '') {
                document.getElementById('passwordError').textContent = 'Password is required.';
                isValid = false;
            } else if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters long.';
                isValid = false;
            }

            if (isValid) { // If form is valid
                alert('Login successful!');
                // Here you can add code to submit the form or redirect
            }
        });

        // Add event listener for password toggle button
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password'); // Get password input element
            const toggle = document.getElementById('togglePassword'); // Get toggle button element
            if (passwordInput.type === 'password') { // If password is hidden
                passwordInput.type = 'text'; // Show password
                toggle.textContent = 'Hide'; // Change button text to Hide
            } else { // If password is shown
                passwordInput.type = 'password'; // Hide password
                toggle.textContent = 'Show'; // Change button text to Show
            }
        });
    </script>
</body>
</html>
